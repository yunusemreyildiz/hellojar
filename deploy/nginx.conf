# nginx supports HTTP Range requests out of the box, which CheerpJ needs.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's stock list already covers .wasm, .jar and .webp
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # never serve these stale (service worker, catalogs)
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location ~ ^/apps/.*\.json$ { add_header Cache-Control "no-cache"; }

    # thumbnails and the emulator's big binaries change rarely
    location ~ ^/dd/t/ { add_header Cache-Control "public, max-age=604800"; }
}
