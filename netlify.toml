# Static site: no build step, serve public/ as-is.
[build]
  publish = "public"
  command = ""

# the service worker and catalog must never be served stale
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/apps/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
